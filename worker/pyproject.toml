[project]
name = "veridex-worker"
version = "0.1.0"
description = "Rooted ingest pipeline: generate -> store -> watermark -> fingerprint -> sign -> log"
requires-python = ">=3.11,<3.15"
dependencies = [
    "veridex-provenance",
    "veridex-storage",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Genblaze pulls provider SDKs; kept optional. The pipeline is tested with a fake generator, and
# GenblazeGenerator imports genblaze lazily so the worker installs and CI run without these.
genblaze = [
    # v0.7.0 train (PyPI 2026-07-29). The umbrella floor pulls genblaze-core>=0.3.8 transitively
    # (genblaze-s3 stays 0.3.6, unchanged this train). core 0.3.8 hardens verify --fetch (rejects
    # remote-authority file:// URLs, redacts presigned URL credentials, no duplicate stream-hash),
    # which is the verification surface /demo/genblaze-verify credits. Pipeline.step() now validates
    # providers inherit from BaseProvider; generator.py uses the shipped GMICloud/OpenAI connectors
    # via named params (model/prompt/modality/fallback_models), so no migration.
    "genblaze>=0.4.5",
    "genblaze-gmicloud>=0.3.5",
    "genblaze-openai>=0.3.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veridex_worker"]

[tool.uv.sources]
veridex-provenance = { workspace = true }
veridex-storage = { workspace = true }
